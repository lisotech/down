<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liso Downloads - Free Video & MP3 Downloader</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo i {
            color: var(--primary);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        /* Supported Platforms Badges */
        .platforms {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
        }

        /* Input Form */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: var(--card-bg);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.btn-fetch {
            padding: 16px 30px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-fetch:hover {
            background: var(--primary-hover);
        }

        /* Media Card Result */
        .result-card {
            display: none;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            margin-top: 20px;
            text-align: left;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 600px) {
            .media-info {
                flex-direction: row;
            }
        }

        .thumbnail {
            width: 100%;
            max-width: 220px;
            border-radius: 12px;
            object-fit: cover;
            margin: 0 auto;
        }

        .details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .details h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .details p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .download-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-download {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
        }

        .btn-mp4 { background: #2563eb; }
        .btn-mp4:hover { background: #1d4ed8; }

        .btn-mp3 { background: #16a34a; }
        .btn-mp3:hover { background: #15803d; }

        /* Loader */
        .spinner {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-cloud-arrow-down"></i> Liso Downloads
        </div>
    </header>

    <div class="container">
        <h1>Download Video & Audio Free</h1>
        <p class="subtitle">Paste link from YouTube, Facebook, TikTok, or Instagram</p>

        <div class="platforms">
            <div class="badge"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YouTube</div>
            <div class="badge"><i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook</div>
            <div class="badge"><i class="fa-brands fa-tiktok"></i> TikTok</div>
            <div class="badge"><i class="fa-brands fa-instagram" style="color: #e4405f;"></i> Instagram</div>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste media URL here..." autocomplete="off">
            <button class="btn-fetch" onclick="fetchMediaInfo()">Fetch Download</button>
        </div>

        <div class="spinner" id="loader"></div>
        <div class="error-msg" id="errorMsg"></div>

        <div class="result-card" id="resultCard">
            <div class="media-info">
                <img id="thumbImg" class="thumbnail" src="" alt="Thumbnail">
                <div class="details">
                    <div>
                        <h3 id="mediaTitle">Media Title</h3>
                        <p id="mediaMeta">Duration: N/A | Author: Unknown</p>
                    </div>
                    <div class="download-actions">
                        <button class="btn-download btn-mp4" onclick="triggerDownload('mp4')">
                            <i class="fa-solid fa-file-video"></i> Download MP4
                        </button>
                        <button class="btn-download btn-mp3" onclick="triggerDownload('mp3')">
                            <i class="fa-solid fa-file-audio"></i> Download MP3
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUrl = '';

        async function fetchMediaInfo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                showError("Please enter a valid link.");
                return;
            }

            // Reset UI states
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/fetch-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Failed to process request');

                // Populate UI elements
                currentUrl = data.url;
                document.getElementById('thumbImg').src = data.thumbnail;
                document.getElementById('mediaTitle').innerText = data.title;
                document.getElementById('mediaMeta').innerText = `Uploader: ${data.uploader} | Duration: ${data.duration}`;
                
                loader.style.display = 'none';
                resultCard.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                showError(err.message);
            }
        }

        async function triggerDownload(type) {
            if (!currentUrl) return;

            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: currentUrl, type: type })
                });

                // If response is NOT OK, read the error message as JSON
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Download failed on server');
                }

                // Response IS OK -> Process binary stream (blob), DO NOT call response.json()
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                
                // Extract filename from response headers or fallback
                a.download = `LisoDownload_${Date.now()}.${type}`;
                
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

            } catch (err) {
                showError(err.message || "Could not download file. Please try again.");
            } finally {
                loader.style.display = 'none';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
